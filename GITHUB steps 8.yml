     PRE-Check Fence(Hold) If job is CYCLIC or NOT:
     Always check if we require fencing or not for your system based on if the job is cyclic(check in 'process_run_detail' table) so as to fence the workstation to avoid job failure while deploying to prod. 
     If fencing is required then write it in IP plan doc. along with unfencing. In case of fencing, do not schedule the CDA deployment, deploy it manually via CDA TOOL.
     (example : Notification_Hub is cyclic hence always fence it before deploying)
     (99% cyclic job failure's chances if workstation is not fenced) 
        
     SQL: select round(1440 *( sysdate - prd.run_start_date ), 2) AS duration_in_minutes_thus_far, prd.*
          from process_run_detail prd
          where prd.status not in ('FAILED', 'SUCCEEDED') and system ='<your system>'
          and prd.run_start_date > sysdate - 1
          order by prd.run_start_date desc;
          
          select * from process_run_detail where system=' ' order by run_start_date desc;
          
          select * from  process_run_detail where system = 'notification_hub' and process_name = 'promo_credit_failed_notifications_load' order by run_start_date desc;
     
